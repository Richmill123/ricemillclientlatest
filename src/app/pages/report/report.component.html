<div class="page-wrap">
  <div class="page-header">
    <h2 class="page-title">Reports</h2>
  </div>

  <!-- Filters -->
  <div class="report-filters">
    <mat-form-field appearance="outline">
      <mat-label>Report Type</mat-label>
      <mat-select [(ngModel)]="selectedType" name="reportType" required>
        <mat-option *ngFor="let type of reportTypes" [value]="type">{{ type }}</mat-option>
      </mat-select>
      <mat-icon matSuffix>category</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Start Date</mat-label>
      <input matInput [matDatepicker]="startPicker" [(ngModel)]="startDate" name="startDate" required>
      <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
      <mat-datepicker #startPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>End Date</mat-label>
      <input matInput [matDatepicker]="endPicker" [(ngModel)]="endDate" name="endDate" required>
      <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
      <mat-datepicker #endPicker></mat-datepicker>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="onSearch()">
      <mat-icon>search</mat-icon> Search
    </button>

    <button mat-stroked-button color="primary" (click)="exportToPDF()" *ngIf="rowData.length">
      <mat-icon>picture_as_pdf</mat-icon> PDF
    </button>

    <button mat-stroked-button color="accent" (click)="exportToCSV()" *ngIf="rowData.length">
      <mat-icon>table_view</mat-icon> CSV
    </button>
  </div>

  <!-- Grid -->
  <ng-container *ngIf="isSearchClicked">
    <div *ngIf="rowData.length === 0" class="empty-state">
      <mat-icon>inbox</mat-icon>
      <p>No records found for the selected criteria.</p>
    </div>

    <div *ngIf="rowData.length > 0" class="grid-wrapper ag-theme-alpine">
      <ag-grid-angular
        #agGrid
        style="width:100%;height:100%"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [gridOptions]="gridOptions"
        [rowHeight]="44"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>
  </ng-container>

  <div *ngIf="!isSearchClicked" class="empty-state">
    <mat-icon>bar_chart</mat-icon>
    <p>Select a report type and date range, then click Search.</p>
  </div>
</div>
