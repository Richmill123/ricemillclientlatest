<div class="sidebar">
  <div class="logo-container">
    <div class="logo" (click)="navigateTo('dashboard')">
      <mat-icon>agriculture</mat-icon>
      <span>Rice Mill</span>
    </div>
  </div>

  <nav class="sidebar-menu">
    <!-- Dashboard — always visible -->
    <a (click)="navigateTo('dashboard')" [class.active]="isActive('dashboard')" class="nav-item">
      <span class="nav-icon"><mat-icon>dashboard</mat-icon></span>
      <span class="nav-label">Dashboard</span>
    </a>

    <a *ngIf="isModuleVisible('billing')" (click)="navigateTo('billing')" [class.active]="isActive('billing')" class="nav-item">
      <span class="nav-icon"><mat-icon>receipt</mat-icon></span>
      <span class="nav-label">Billing</span>
    </a>

    <a *ngIf="isModuleVisible('employees')" (click)="navigateTo('employees')" [class.active]="isActive('employees')" class="nav-item">
      <span class="nav-icon"><mat-icon>people</mat-icon></span>
      <span class="nav-label">Employees</span>
    </a>

    <a *ngIf="isModuleVisible('expenses')" (click)="navigateTo('expenses')" [class.active]="isActive('expenses')" class="nav-item">
      <span class="nav-icon"><mat-icon>receipt_long</mat-icon></span>
      <span class="nav-label">Expenses</span>
    </a>

    <a *ngIf="isModuleVisible('income')" (click)="navigateTo('income')" [class.active]="isActive('income')" class="nav-item">
      <span class="nav-icon"><mat-icon>trending_up</mat-icon></span>
      <span class="nav-label">Income</span>
    </a>

    <a *ngIf="isModuleVisible('orders')" (click)="navigateTo('orders')" [class.active]="isActive('orders')" class="nav-item">
      <span class="nav-icon"><mat-icon>shopping_cart</mat-icon></span>
      <span class="nav-label">Orders</span>
    </a>

    <a *ngIf="isModuleVisible('purchases')" (click)="navigateTo('purchases')" [class.active]="isActive('purchases')" class="nav-item">
      <span class="nav-icon"><mat-icon>shopping_bag</mat-icon></span>
      <span class="nav-label">Purchases</span>
    </a>

    <a *ngIf="isModuleVisible('reports')" (click)="navigateTo('reports')" [class.active]="isActive('reports')" class="nav-item">
      <span class="nav-icon"><mat-icon>bar_chart</mat-icon></span>
      <span class="nav-label">Reports</span>
    </a>

    <a *ngIf="isModuleVisible('sales')" (click)="navigateTo('sales')" [class.active]="isActive('sales')" class="nav-item">
      <span class="nav-icon"><mat-icon>point_of_sale</mat-icon></span>
      <span class="nav-label">Sales</span>
    </a>

    <a *ngIf="isModuleVisible('stock')" (click)="navigateTo('stock')" [class.active]="isActive('stock')" class="nav-item">
      <span class="nav-icon"><mat-icon>inventory_2</mat-icon></span>
      <span class="nav-label">Stock</span>
    </a>

    <a *ngIf="isModuleVisible('wages')" (click)="navigateTo('wages')" [class.active]="isActive('wages')" class="nav-item">
      <span class="nav-icon"><mat-icon>payments</mat-icon></span>
      <span class="nav-label">Wages</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <a (click)="logout()" class="nav-item logout-btn">
      <span class="nav-icon"><mat-icon>logout</mat-icon></span>
      <span class="nav-label">Logout</span>
    </a>
  </div>
</div>
